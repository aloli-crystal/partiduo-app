name: partiduo
version: 0.1.0

description: |
  Partiduo — comptabilité et facturation en Crystal.
  Socle et modules activables, sans interface : le contrat Partiduo::Api
  est consommé par un dépôt d'interface (partiduo-ui-bulma).

authors:
  - Philippe Nénert <it+claude.ai@aloli.fr>

crystal: ">= 1.19.1"

license: AGPL-3.0-or-later

targets:
  partiduo-manage:
    main: manage.cr

dependencies:
  marten:
    path: ../../marten
  marten_auth:
    github: martenframework/marten-auth
    version: ">= 0.2.0"
  pg:
    github: will/crystal-pg
  # Shards maison, en path: tant qu'ils ne sont pas publiés (lot P).
  authn:
    path: ../../authn
  password-policy:
    path: ../../password-policy
  totp:
    path: ../../totp
  webauthn:
    path: ../../webauthn
  jose:
    path: ../../jose
  saml:
    path: ../../saml
  # Lot F : PDF/A-3 Factur-X (ADR-006 D5) et son contrôle.
  pdf-a:
    path: ../../pdf-a
  pdf-validate:
    path: ../../pdf-validate

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"
