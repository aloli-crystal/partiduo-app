#
# Paramètres datés chargés dans une instance neuve (jeu de données initial du
# module micro, ADR-007 D1) : ce sont des *données*, modifiables par
# l'administrateur (`Partiduo::Api::Micro.set_parameter`) et à mettre à jour
# chaque année (loi de financement de la sécurité sociale, loi de finances,
# revalorisation triennale des seuils). Rien de ce qui suit n'est lu par le
# code autrement que par la table `micro_parameter`.
#
# Valeurs vérifiées aux sources officielles le 29 septembre 2026 (DECISIONS
# D-VAL-001 à D-VAL-005, tableau `doc/sources-officielles.adoc`) ; la source
# de chaque groupe est indiquée au-dessus de ses lignes.
#
# Codes :
# * rate.social.<catégorie>  — cotisations sociales, % du chiffre d'affaires ;
# * rate.cfp.<catégorie>     — contribution à la formation professionnelle, % ;
# * rate.flat_tax.<catégorie> — versement libératoire de l'impôt sur le revenu, % ;
# * threshold.vat.<goods|services>           — franchise en base de TVA (293 B) ;
# * threshold.vat_tolerance.<goods|services> — seuil majoré de la franchise ;
# * threshold.micro.<goods|services>         — régime micro (art. 50-0 et 102 ter) ;
# * alert.ratio — part du seuil (en %) à partir de laquelle une alerte est levée ;
# * box.<catégorie>, box.flat_tax.<catégorie> — cases de la 2042-C-PRO (texte).
#
# Catégories : sale_bic (ventes, a du tableau de l'art. D613-4 CSS),
# service_bic (prestations BIC, d), bnc (prestations libérales relevant du
# régime général, e). Non modélisés (D-VAL-003) : les libéraux affiliés à la
# Cipav (b : 23,2 % depuis le 1er juillet 2024, à saisir à la place du taux
# `bnc` par `set_parameter`), les meublés de tourisme classés (c : 6 %) et
# les taxes pour frais de chambre consulaire (CCI 0,015 % ventes, 0,044 %
# prestations ; CMA 0,22 % achat-vente, 0,48 % prestations hors Alsace-Moselle).
parameters:
  # Cotisations sociales : art. D613-4 du code de la sécurité sociale,
  # Légifrance, versions en vigueur du 10/12/2022 au 01/06/2024, puis jusqu'au
  # 31/12/2025, puis depuis le 01/01/2026 (décret n° 2025-943 du 8 septembre
  # 2025) — https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000046714712
  # (consulté le 29/09/2026) ; calendrier BNC : urssaf.fr, « Évolution des taux
  # de cotisations sociales des auto-entrepreneurs », mis à jour le 30/01/2026 —
  # https://www.urssaf.fr/accueil/actualites/taux-cotisations-autoentrepeneur.html
  # (consulté le 29/09/2026).
  - {code: rate.social.sale_bic, valid_from: "2024-01-01", value: "12.3"}
  - {code: rate.social.service_bic, valid_from: "2024-01-01", value: "21.2"}
  - {code: rate.social.bnc, valid_from: "2024-07-01", value: "23.1"}
  - {code: rate.social.bnc, valid_from: "2025-01-01", value: "24.6"}
  # 25,6 % (décret n° 2025-943) et non 26,1 % (calendrier du décret
  # n° 2024-484, remplacé avant d'entrer en vigueur).
  - {code: rate.social.bnc, valid_from: "2026-01-01", value: "25.6"}
  # CFP des micro-entrepreneurs : service-public.gouv.fr, fiche F23459,
  # vérifiée le 01/01/2026 —
  # https://entreprendre.service-public.gouv.fr/vosdroits/F23459 (consultée le
  # 29/09/2026) : 0,1 % commerce, 0,3 % artisanat, 0,2 % libéral. Le taux de
  # `service_bic` est celui des artisans : un commerçant prestataire de
  # services paie 0,1 % (à saisir par `set_parameter`, D-VAL-002).
  - {code: rate.cfp.sale_bic, valid_from: "2024-01-01", value: "0.1"}
  - {code: rate.cfp.service_bic, valid_from: "2024-01-01", value: "0.3"}
  - {code: rate.cfp.bnc, valid_from: "2024-01-01", value: "0.2"}
  # Versement libératoire : art. 151-0 du CGI, II, version en vigueur depuis
  # le 19/06/2025 —
  # https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006069577/LEGISCTA000022850373
  # (consulté le 29/09/2026) ; mêmes taux sur impots.gouv.fr, « Comment
  # déclarer les revenus provenant de mon activité de micro-entrepreneur ? ».
  - {code: rate.flat_tax.sale_bic, valid_from: "2024-01-01", value: "1"}
  - {code: rate.flat_tax.service_bic, valid_from: "2024-01-01", value: "1.7"}
  - {code: rate.flat_tax.bnc, valid_from: "2024-01-01", value: "2.2"}
  # Franchise en base de TVA : art. 293 B du CGI, I, version en vigueur du
  # 01/03/2025 au 01/01/2027 (loi n° 2025-1044 du 3 novembre 2025, qui
  # rétablit ces seuils à compter du 1er mars 2025 ; l'ordonnance n° 2025-1247
  # recodifie la franchise au 1er janvier 2027) —
  # https://www.legifrance.gouv.fr/codes/id/LEGISCTA000006162567/ (consulté le
  # 29/09/2026) ; mêmes seuils pour 2026 : service-public.gouv.fr, fiche
  # F21746, vérifiée le 01/01/2026. Au 1er janvier 2025 : seuils de l'art. 82
  # de la loi n° 2023-1322 de finances pour 2024 (BOFiP, actualité du
  # 01/07/2026 liée au BOI-BAREME-000036).
  - {code: threshold.vat.goods, valid_from: "2025-01-01", value: "85000"}
  - {code: threshold.vat.services, valid_from: "2025-01-01", value: "37500"}
  - {code: threshold.vat_tolerance.goods, valid_from: "2025-01-01", value: "93500"}
  - {code: threshold.vat_tolerance.services, valid_from: "2025-01-01", value: "41250"}
  # Régime micro : BOFiP BOI-BAREME-000044 du 19/08/2026 (seuils de l'année
  # 2025, puis des années 2026 à 2028) —
  # https://bofip.impots.gouv.fr/bofip/14069-PGP.html/identifiant=BOI-BAREME-000044-20260819
  # (consulté le 29/09/2026) ; 188 700 € et 77 700 € appliqués depuis 2023
  # (service-public.gouv.fr, fiche F32353, vérifiée le 21/02/2026).
  - {code: threshold.micro.goods, valid_from: "2023-01-01", value: "188700"}
  - {code: threshold.micro.services, valid_from: "2023-01-01", value: "77700"}
  - {code: threshold.micro.goods, valid_from: "2026-01-01", value: "203100"}
  - {code: threshold.micro.services, valid_from: "2026-01-01", value: "83600"}
  # Choix de Partiduo (pas une valeur officielle) : alerte à 80 % du seuil.
  - {code: alert.ratio, valid_from: "2020-01-01", value: "80"}
  # Cases de la 2042-C-PRO (revenus professionnels) : impots.gouv.fr,
  # « Comment déclarer les revenus provenant de mon activité de
  # micro-entrepreneur ? » —
  # https://www.impots.gouv.fr/particulier/questions/comment-declarer-les-revenus-provenant-de-mon-activite-dauto-entrepreneur
  # (consulté le 29/09/2026). Les revenus non professionnels (5NO, 5NP, BNC
  # non professionnels) ne sont pas modélisés (D-VAL-004).
  - {code: box.sale_bic, valid_from: "2020-01-01", text: "5KO"}
  - {code: box.service_bic, valid_from: "2020-01-01", text: "5KP"}
  - {code: box.bnc, valid_from: "2020-01-01", text: "5HQ"}
  - {code: box.flat_tax.sale_bic, valid_from: "2020-01-01", text: "5TA"}
  - {code: box.flat_tax.service_bic, valid_from: "2020-01-01", text: "5TB"}
  - {code: box.flat_tax.bnc, valid_from: "2020-01-01", text: "5TE"}
natures:
  - {code: SALE, kind: receipt, category: sale_bic}
  - {code: SERVICE, kind: receipt, category: service_bic}
  - {code: FEE, kind: receipt, category: bnc}
  - {code: GOODS, kind: purchase, category: goods}
  - {code: SUPPLIES, kind: purchase, category: other}
