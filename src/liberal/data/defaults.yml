#
# Jeu de données initial du module liberal (ADR-007 D6) : ce sont des
# *données*, modifiables par l'administrateur
# (`Partiduo::Api::Liberal.set_form_line`, `create_nature`) et à mettre à jour
# à chaque millésime. Le code ne lit la correspondance que dans la table
# `liberal_form_line`.
#
# form_lines : poste (rubrique de la 2035-A ou total calculé) → formulaire,
# ligne et case, en vigueur à partir du millésime `millesime` (année des
# revenus déclarés). Vérifiées le 29 septembre 2026 (DECISIONS D-VAL-006 à
# D-VAL-009, tableau `doc/sources-officielles.adoc`) :
#
# * lignes : formulaires officiels n° 2035-A-SD et 2035-B-SD (cerfa
#   n° 15945*07, revenus 2024, et n° 15945*08, revenus 2025, mêmes lignes) et
#   n° 2035-SD, impots.gouv.fr —
#   https://www.impots.gouv.fr/sites/default/files/formulaires/2035-sd/2025/2035-sd_4983.pdf
#   https://www.impots.gouv.fr/sites/default/files/formulaires/2035-sd/2026/2035-sd_5384.pdf
#   https://www.impots.gouv.fr/sites/default/files/formulaires/2035-sd/2026/2035-sd_5382.pdf
#   (consultés le 29/09/2026) ;
# * cases : codes des zones de l'échange de données (EDI-TDFC), relevés dans
#   les spécifications des formulaires 2035, 2035A et 2035B de TELEDEC,
#   millésimes 2025 et 2026 (`partiduo/.teledec-doc/FORMULAIRES-TELEDEC.adoc`),
#   identiques pour les revenus 2024 et 2025. Ce sont ces codes que
#   `partiduo-teledec` transmet (`<case>_<formulaire>`). Là où le formulaire
#   papier porte une autre lettre, elle est notée en commentaire (« papier ») ;
#   les sous-lignes sans lettre sur le papier (lignes 17 à 24, 26 à 30) ont
#   pourtant un code EDI.
#
# Les lignes de sous-total de la 2035-A (BH, BJ, BK, BM) ont leur poste
# calculé. `provision` n'a pas de ligne dans la 2035-B : les provisions sont
# comprises dans les « divers à déduire » (ligne 43), à détailler.
# Les tableaux I (immobilisations) et II (plus et moins-values) de la 2035
# n'ont pas de code de zone : ils se reportent à la main.
#
# natures : une nature par rubrique, libellé dans la langue de l'instance
# (`liberal.headings.<rubrique>`).
