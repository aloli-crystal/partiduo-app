#
# Jeu de données initial du module liberal (ADR-007 D6) : ce sont des
# *données*, modifiables par l'administrateur
# (`Partiduo::Api::Liberal.set_form_line`, `create_nature`) et à mettre à jour
# à chaque millésime. Le code ne lit la correspondance que dans la table
# `liberal_form_line`.
#
# form_lines : poste (rubrique de la 2035-A ou total calculé) → formulaire,
# ligne et case, en vigueur à partir du millésime `millesime` (année des
# revenus déclarés). Lignes et cases relevées de mémoire le 27 septembre 2026
# d'après la 2035-A et la 2035-B des revenus 2024 et 2025, sans accès au
# formulaire officiel : à vérifier sur impots.gouv.fr avant tout dépôt
# (BLOCAGES B-LIB-001, DECISIONS D-LIB-004).
#
# natures : une nature par rubrique, libellé dans la langue de l'instance
# (`liberal.headings.<rubrique>`).
