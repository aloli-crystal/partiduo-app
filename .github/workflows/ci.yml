# SPDX-License-Identifier: AGPL-3.0-or-later
#
# CI de partiduo-app : format, Ameba, garde-fou d'interface (ADR-005 D3), specs
# sur PostgreSQL dans les configurations de modules (ADR-006 D7, ADR-007).
name: CI

on:
  push:
    branches: [development, production]
  pull_request:

env:
  CRYSTAL_VERSION: "1.19.1"
  SKIP_MARTEN_CLI_PRECOMPILATION: "1"

jobs:
  qualite:
    name: Format, Ameba, garde-fou
    runs-on: ubuntu-latest
    container: crystallang/crystal:1.19.1
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances path (shards maison non publiés)
        run: scripts/ci-checkout-deps.sh
      - name: Format
        run: crystal tool format --check src spec config scripts manage.cr
      - name: Shards
        run: shards install
      - name: Ameba
        run: mkdir -p bin && crystal build lib/ameba/bin/ameba.cr -o bin/ameba && bin/ameba
      - name: Garde-fou ADR-005 D3 (aucune interface sous src/)
        run: crystal run scripts/interface_boundary.cr -- src

  specs:
    name: Specs (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: comptabilite-seule
            modules: accounting,analytic,stock,followup
          - configuration: facturation-seule
            modules: invoicing,stock,followup
          - configuration: comptabilite-et-facturation
            modules: accounting,invoicing,analytic,stock,followup
          # Module micro-entreprise (ADR-007, D-MIC-008).
          - configuration: micro-seul
            modules: micro
          - configuration: micro-et-facturation
            modules: micro,invoicing
          - configuration: micro-facturation-et-comptabilite
            modules: micro,invoicing,accounting
          # Module des professions libérales (ADR-007 D6, D-LIB-006).
          - configuration: liberal-seul
            modules: liberal
          - configuration: liberal-et-comptabilite
            modules: liberal,accounting
    services:
      postgres:
        image: postgres:18
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: partiduo
          POSTGRES_PASSWORD: partiduo
          POSTGRES_DB: partiduo_test
        options: >-
          --health-cmd "pg_isready -U partiduo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # En CI seulement, PostgreSQL est un service joignable en TCP.
      DATABASE_URL: postgres://partiduo:partiduo@localhost:5432/partiduo_test
      PARTIDUO_MODULES: ${{ matrix.modules }}
    steps:
      - uses: actions/checkout@v4
      - name: Mémoire d'échange (la compilation des specs dépasse 6 Go)
        run: |
          sudo fallocate -l 12G /swap-ci && sudo chmod 600 /swap-ci
          sudo mkswap /swap-ci && sudo swapon /swap-ci && free -h
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.19.1
      - name: Bibliothèques de compilation
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libyaml-dev libssl-dev libgmp-dev libxml2-dev libpcre2-dev lld
      - name: Dépendances path (shards maison non publiés)
        run: scripts/ci-checkout-deps.sh
      - name: Shards
        run: shards install
      - name: Specs
        run: crystal spec --order random --no-debug --threads 1 --link-flags=-fuse-ld=lld
